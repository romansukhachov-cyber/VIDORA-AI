name: VIDORA AI Android Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract VIDORA project
        run: |
          if [ ! -d "app" ]; then
            ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "ERROR: VIDORA ZIP not found"
              echo "Files in repository:"
              find . -maxdepth 2 -type f | sort
              exit 1
            fi

            echo "Extracting $ZIP"
            unzip -o "$ZIP" -d extracted

            PROJECT_DIR=$(find extracted -maxdepth 2 -type d -name "app" | head -n 1)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: app directory not found inside ZIP"
              find extracted -maxdepth 4 -type f | sort
              exit 1
            fi

            ROOT_DIR=$(dirname "$PROJECT_DIR")

            cp -R "$ROOT_DIR"/. .
          fi

      - name: Check project
        run: |
          echo "Project structure:"
          ls -la
          echo "App directory:"
          ls -la app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vidora-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
